name: Deploy LabMonitor Local

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Atualizar código e reiniciar containers
        run: |
          cd /home/jadson/lab/backend/lab-monitor
          git pull origin main
          docker compose pull
          docker compose up -d --build
